<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "receipt-upload" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    {% block body %}{% endblock %}
    <script>
      document.querySelectorAll("[data-loading-form]").forEach((form) => {
        form.addEventListener("submit", () => {
          form.classList.add("is-loading");
          form.setAttribute("aria-busy", "true");
          form.querySelectorAll("button[type='submit']").forEach((button) => {
            button.dataset.originalText = button.textContent;
            button.textContent = button.dataset.loadingText || "Working...";
            button.disabled = true;
          });
        });
      });

      document.querySelectorAll("[data-append-files]").forEach((input) => {
        const form = input.closest("form");
        const fileList = document.getElementById(input.dataset.fileList);
        const fileCount = document.getElementById("receipt-file-count");
        const clearButton = form ? form.querySelector("[data-clear-files]") : null;
        let selectedFiles = window.DataTransfer ? new DataTransfer() : null;

        const renderFiles = () => {
          const files = selectedFiles ? selectedFiles.files : input.files;
          if (fileCount) {
            const count = files.length;
            fileCount.textContent = count === 1 ? "1 file selected" : `${count} files selected`;
          }
          if (!fileList) {
            return;
          }
          fileList.innerHTML = "";
          Array.from(files).forEach((file) => {
            const item = document.createElement("li");
            item.textContent = file.name;
            fileList.appendChild(item);
          });
        };

        input.addEventListener("change", () => {
          if (selectedFiles) {
            Array.from(input.files).forEach((file) => selectedFiles.items.add(file));
            input.files = selectedFiles.files;
          }
          renderFiles();
        });

        if (clearButton) {
          clearButton.addEventListener("click", () => {
            if (window.DataTransfer) {
              selectedFiles = new DataTransfer();
              input.files = selectedFiles.files;
            } else {
              input.value = "";
            }
            renderFiles();
          });
        }

        renderFiles();
      });

      document.querySelectorAll("[data-download-link]").forEach((link) => {
        link.addEventListener("click", () => {
          if (link.classList.contains("is-loading")) {
            return;
          }
          link.dataset.originalText = link.textContent;
          link.textContent = link.dataset.loadingText || "Preparing...";
          link.classList.add("is-loading");
          link.setAttribute("aria-busy", "true");
          window.setTimeout(() => {
            link.textContent = link.dataset.originalText || "Download";
            link.classList.remove("is-loading");
            link.removeAttribute("aria-busy");
          }, 8000);
        });
      });
    </script>
  </body>
</html>
