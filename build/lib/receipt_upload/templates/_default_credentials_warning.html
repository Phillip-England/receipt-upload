{% if settings.uses_default_admin_credentials %}
<div class="security-warning" role="alert">
  <strong>Default admin credentials are active.</strong>
  The admin username or password still matches the built-in default of <code>admin</code> / <code>password</code>.
  Set <code>ADMIN_USERNAME</code> and <code>ADMIN_PASSWORD</code> in the environment before starting the app.
</div>
{% endif %}
